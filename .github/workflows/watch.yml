name: watch

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - test

permissions:
  contents: write            # needed to commit fares.db back

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher (normal mode)
        if: github.event_name == 'schedule' || inputs.mode == 'normal'
        env:
          CMB_PHONE: ${{ secrets.CMB_PHONE }}
          CMB_KEY: ${{ secrets.CMB_KEY }}
        run: python watcher.py

      - name: Run watcher (test mode — forces WhatsApp regardless of thresholds)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          CMB_PHONE: ${{ secrets.CMB_PHONE }}
          CMB_KEY: ${{ secrets.CMB_KEY }}
        run: python test_run.py

      - name: Persist fare history
        if: github.event_name == 'schedule' || inputs.mode == 'normal'
        run: |
          git config user.name "watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fares.db
          git diff --cached --quiet || git commit -m "fare update $(date -u +%FT%TZ)"
          git push
