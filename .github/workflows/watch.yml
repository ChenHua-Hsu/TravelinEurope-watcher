name: watch

on:
  schedule:
    - cron: "0 2 * * *"      # daily 02:00 UTC → watch mode
    - cron: "30 2 * * 0"     # Sunday 02:30 UTC → full scan
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "watch"
        type: choice
        options:
          - watch
          - full
          - test

permissions:
  contents: read              # cache is managed outside git; no need for write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Restore fares.db from previous run's cache (if any).
      - name: Restore fare state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: fares.db
          key: fares-db-${{ github.run_id }}
          restore-keys: |
            fares-db-

      - name: Determine mode
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "30 2 * * 0" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=watch" >> "$GITHUB_OUTPUT"
          fi

      - name: Run watcher (full / watch)
        if: steps.pick.outputs.mode == 'full' || steps.pick.outputs.mode == 'watch'
        env:
          CMB_PHONE: ${{ secrets.CMB_PHONE }}
          CMB_KEY: ${{ secrets.CMB_KEY }}
        run: python watcher.py --mode ${{ steps.pick.outputs.mode }}

      - name: Run test preview
        if: steps.pick.outputs.mode == 'test'
        env:
          CMB_PHONE: ${{ secrets.CMB_PHONE }}
          CMB_KEY: ${{ secrets.CMB_KEY }}
        run: python test_run.py

      # Save fares.db back to cache for the next run.
      - name: Save fare state
        if: steps.pick.outputs.mode != 'test' && always()
        uses: actions/cache/save@v4
        with:
          path: fares.db
          key: fares-db-${{ github.run_id }}
