# Trip configuration.
#
# Schema:
#   window_start / window_end: date range the scanner probes (inclusive).
#       For flexible trips: ~1 month before plan to ~1 month after.
#       For locked trips: narrow or single day.
#   duration_days: trip length in days (depart on day D, return on day D + duration - 1).
#   planned_depart: used in alerts for comparison ("Plan date: €X vs cheapest: €Y").
#   locked: true = schedule is fixed, scanning is just for info; false = can swap dates.
#   watch_days_before: [min, max] days before departure to actually scan.
#   top_n_watch: how many cheapest dates to monitor daily between weekly full scans.
#   baseline_discount_pct: alert on daily watch when a date drops this % below its last price.

origin: GVA

# Safety cap: scrape count per month before the watcher auto-stops.
# NOT a billing cap (nothing is billed) — just a bug circuit-breaker.
monthly_request_cap: 10000
warn_at_pct: 80
stop_at_pct: 90

# Number of cheapest dates per trip to monitor between weekly full scans.
default_top_n_watch: 5

# For each trip, also scan combinations that extend the duration by 0, 1, 2 days.
# e.g. a 5-day trip is also checked at 6 and 7 days. Lets you catch deals that
# require staying an extra night. Set to 0 per-trip to disable (e.g. for locked
# calendar-tied trips like Christmas / NYE where duration can't be flexed).
default_duration_flex_days: 2

