# Trip configuration — edit to add/change trips.
# `locked: true` = fixed dates (don't reorder); `locked: false` = flexible window.
# `watch_days_before: [min, max]` = only check fares when departure is in this window.
# `baseline_discount_pct` = alert threshold vs rolling 30-day median.

origin: GVA

# Hard safety cap — watcher refuses to call Amadeus beyond this per calendar month.
# Amadeus free tier is 2000; we set a lower cap so we stop well before it, and send
# a WhatsApp warning at 80% and a hard-stop alert at 90%.
monthly_request_cap: 1800
warn_at_pct: 80
stop_at_pct: 90

